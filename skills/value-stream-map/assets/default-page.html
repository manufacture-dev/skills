<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Value Stream Map</title>
<!-- Default page of the value-stream-map skill (MIT). It renders any map: run `vsm.mjs embed <map.json> --page <this file>`.
     To restyle it in an organisation's look, change the tokens in the first :root blocks (colours, font, radius);
     for a full design system, write a new page from the same data (see SKILL.md). -->
<style>
:root{
  --bg:#f6f6f4; --surface:#ffffff; --surface-2:#f0f1f3; --ink:#1c1f24; --muted:#5b616b; --line:#d8dbe0; --line-strong:#9aa1ab;
  --wait:#d97a1f; --wait-soft:#fbe7d2; --work:#2c68b0; --work-soft:#d9e6f6;
  --rework:#b42a68; --ai:#6a45bf; --ai-soft:#ece6fa;
  --red:#b83226; --amber:#a86b0c; --green:#2d7a4f; --sel:#ffd34d;
  --mk-good:#2d7a4f; --mk-bad:#b83226; --mk-warn:#a86b0c; --mk-neutral:#5b616b;
  --radius:8px; --shadow:0 1px 2px rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14161a; --surface:#1d2025; --surface-2:#252930; --ink:#e6e8eb; --muted:#a3aab4; --line:#353a42; --line-strong:#6b727d;
    --wait:#eba05a; --wait-soft:#4a3320; --work:#6aa5ea; --work-soft:#1f3550;
    --rework:#ec6fa6; --ai:#b39af0; --ai-soft:#2e2643;
    --red:#f0796d; --amber:#e3b04e; --green:#6cc993; --sel:#c9a227;
    --mk-good:#6cc993; --mk-bad:#f0796d; --mk-warn:#e3b04e; --mk-neutral:#a3aab4;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#14161a; --surface:#1d2025; --surface-2:#252930; --ink:#e6e8eb; --muted:#a3aab4; --line:#353a42; --line-strong:#6b727d;
  --wait:#eba05a; --wait-soft:#4a3320; --work:#6aa5ea; --work-soft:#1f3550;
  --rework:#ec6fa6; --ai:#b39af0; --ai-soft:#2e2643;
  --red:#f0796d; --amber:#e3b04e; --green:#6cc993; --sel:#c9a227;
  --mk-good:#6cc993; --mk-bad:#f0796d; --mk-warn:#e3b04e; --mk-neutral:#a3aab4;
  --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow-x:hidden}
main{max-width:1180px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:22px;line-height:1.25;margin:4px 0 8px}
h2{font-size:16px;margin:0 0 10px}
section{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:14px 0;box-shadow:var(--shadow);min-width:0}
.muted{color:var(--muted)}
.small{font-size:12px}
button{font:inherit;color:inherit}
a{color:var(--work)}
.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.client{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:6px;overflow:hidden}
.seg button{background:transparent;border:0;padding:5px 12px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line-strong)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.flowline{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;margin:6px 0}
.flowline b{font-weight:600}
.team{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:1px 9px;font-size:12px;background:var(--surface-2)}
/* totals */
.totals{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.tot{border-left:3px solid var(--line-strong);padding:2px 0 2px 10px;min-width:0}
.tot .v{font-size:28px;font-weight:650;line-height:1.1}
.tot .l{font-size:12px;color:var(--muted)}
.tot.wait{border-color:var(--wait)} .tot.work{border-color:var(--work)}
.tot .sub{font-size:12px;color:var(--red);margin-top:4px}
@media (max-width:720px){.totals{grid-template-columns:repeat(2,minmax(0,1fr))}.tot .v{font-size:22px}}
/* map */
.maphead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.flow-scroll{overflow-x:auto;overflow-y:hidden;border:1px solid var(--line);border-radius:6px;background:var(--bg);-webkit-overflow-scrolling:touch}
.canvas{position:relative;display:grid;grid-auto-flow:column;grid-template-rows:auto var(--lanes,14px) auto;width:max-content;padding:14px 14px 10px}
.canvas svg.arrows{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.link{grid-row:1;align-self:center;padding:0 4px;color:var(--line-strong);font-size:18px;text-align:center;min-width:26px}
.frame{grid-row:1;border:1.5px solid var(--line-strong);border-radius:10px;background:var(--surface);padding:8px 10px 12px;display:flex;flex-direction:column;min-width:0}
.frame.assumed{border-style:dashed}
.fhead{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline;margin-bottom:8px;max-width:100%}
.fhead .nm{font-weight:650}
.fhead .sig{font-size:12px;color:var(--muted)}
.fbody{display:flex;align-items:flex-start;gap:0}
.col{display:flex;flex-direction:column;gap:12px}
.unit{display:grid;grid-template-columns:62px 210px;grid-template-areas:". ai" "q box" ". mk"}
.unit.first-up{grid-template-columns:0 210px}
.unit .ais{grid-area:ai;display:flex;flex-direction:column;gap:3px;margin-bottom:4px}
.unit .mks{grid-area:mk;display:flex;flex-direction:column;gap:3px;margin-top:4px}
.q{grid-area:q;align-self:center;text-align:center;color:var(--wait);font-size:12px;line-height:1.15;padding:0 4px}
.q .tri{font-size:18px;display:block}
.q.unknown{color:var(--muted)}
.q.arrow{color:var(--line-strong);font-size:18px}
.q .felt{display:block;font-size:10px;color:var(--muted)}
.box{grid-area:box;position:relative;background:var(--surface);border:1.5px solid var(--line-strong);border-radius:6px;padding:7px 9px;cursor:pointer;text-align:left;width:100%;display:block}
.box:focus-visible{outline:2px solid var(--work);outline-offset:2px}
.box.assumed,.box.confirm{border-style:dashed}
.box.upstream{border-style:dotted;border-width:2px;background:var(--surface-2)}
.box.sel{box-shadow:0 0 0 3px var(--sel)}
.box.end{border-color:var(--rework)}
.box .nm{font-weight:600;line-height:1.25;margin-bottom:3px}
.box .ln{font-size:12px;color:var(--muted)}
.box .ln.tools{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px}
.box .ln.wk{color:var(--work);font-weight:600}
.box .ln.wk .words{font-weight:400;color:var(--muted)}
.box .ln.wk.unknown{color:var(--muted)}
.ca{font-weight:650}
.ca.red{color:var(--red)} .ca.amber{color:var(--amber)} .ca.ok{color:var(--green)}
.badges{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.tag{display:inline-block;font-size:10.5px;border:1px solid var(--line-strong);border-radius:4px;padding:0 5px;color:var(--muted);white-space:nowrap}
.tag.tc{border-style:dashed}
.tag.rw{border-color:var(--rework);color:var(--rework);font-weight:600}
.tag.felt{border-color:var(--wait);color:var(--wait)}
.ai{font-size:11.5px;background:var(--ai-soft);color:var(--ink);border-left:3px solid var(--ai);border-radius:4px;padding:2px 6px;line-height:1.3}
.ai.confirm{border:1px dashed var(--ai);border-left-width:3px}
.notch{font-family:ui-monospace,Menlo,monospace;color:var(--ai);letter-spacing:-1px;margin-right:4px}
.lvl{font-weight:600;color:var(--ai);margin-right:4px}
.mk{font-size:11.5px;border-left:3px solid var(--mk-neutral);padding:1px 6px;background:var(--surface-2);border-radius:4px;line-height:1.3}
.mk.confirm{border:1px dashed var(--line-strong);border-left-width:3px}
.mk b{font-weight:650}
.mk-accelerates{border-left-color:var(--mk-good)} .mk-slows,.mk-pain{border-left-color:var(--mk-warn)}
.mk-bottleneck,.mk-new-bottleneck,.mk-new-pain{border-left-color:var(--mk-bad)} .mk-duplicate,.mk-not-done{border-left-color:var(--mk-neutral)}
/* macro boxes */
.mbox{grid-row:1;width:224px;background:var(--surface);border:1.5px solid var(--line-strong);border-radius:10px;padding:9px 11px;cursor:pointer;text-align:left;display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch}
.mbox.assumed{border-style:dashed}
.mbox.sel{box-shadow:0 0 0 3px var(--sel)}
.mbox.end{border-color:var(--rework)}
.mbox .nm{font-weight:650;margin-bottom:3px}
.mbox .ln{font-size:12px;color:var(--muted);margin-top:2px}
.mbox .tm{font-size:12.5px;margin-top:5px}
.mbox .tm .w{color:var(--wait);font-weight:600} .mbox .tm .k{color:var(--work);font-weight:600}
.mbox .ln.tools{font-family:ui-monospace,Menlo,monospace;font-size:11px}
.mlink{grid-row:1;align-self:center;text-align:center;color:var(--wait);font-size:12px;padding:0 6px;min-width:58px;line-height:1.15}
.mlink .tri{font-size:18px;display:block}
/* timeline */
.tl{grid-row:3;padding-top:6px;min-width:0}
.bar{display:flex;height:12px;border-radius:3px;overflow:hidden;background:transparent}
.bar .bw{background:var(--wait)} .bar .bk{background:var(--work)}
.bar.up{outline:1.5px dotted var(--line-strong)}
.tl .cap{font-size:11px;color:var(--muted);margin-top:3px;white-space:nowrap}
.lanehint{font-size:12px;color:var(--muted)}
.arrows path.ln{fill:none;stroke:var(--rework);stroke-width:1.8}
.arrows path.ln.confirm{stroke-dasharray:5 4}
.arrows text{font-size:11px;fill:var(--rework);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round;font-weight:600}
.arrows .head{fill:var(--rework)}
.arrows circle{fill:var(--rework)}
.detail{margin-top:10px;border:1px solid var(--line);border-radius:6px;padding:10px 12px;background:var(--surface-2);font-size:13px}
.detail dl{display:grid;grid-template-columns:max-content 1fr;gap:3px 12px;margin:6px 0 0}
.detail dt{color:var(--muted)} .detail dd{margin:0}
/* tables */
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap}
td.num,th.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
tr.longest td{background:var(--wait-soft)}
tr.total td{font-weight:650;border-top:2px solid var(--line-strong)}
tr.up td{font-style:italic;color:var(--muted)}
tr.loop{cursor:pointer}
tr.loop:hover td{background:var(--surface-2)}
tr.loop.on td{background:var(--ai-soft)}
tr.loop.confirm td:first-child{border-left:3px dashed var(--rework)}
.loopbtn{background:none;border:1px solid var(--rework);color:var(--rework);border-radius:4px;padding:1px 7px;cursor:pointer;font-size:12px;white-space:nowrap}
tr.loop.on .loopbtn{background:var(--rework);color:var(--surface)}
.note{font-size:12px;color:var(--muted);margin-top:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:720px){.grid2{grid-template-columns:1fr}}
ul.plain{margin:4px 0 0;padding-left:18px} ul.plain li{margin:2px 0}
.st{font-size:11px;font-weight:650;border-radius:4px;padding:0 6px;border:1px solid currentColor;margin-right:6px;white-space:nowrap}
.st-confirmed{color:var(--green)} .st-refuted{color:var(--red)} .st-partial{color:var(--amber)} .st-open{color:var(--muted)}
details.legend summary{cursor:pointer;font-weight:650;font-size:16px}
.legend-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:6px 18px;margin-top:10px;font-size:13px}
.legend-grid .sym{display:inline-block;min-width:46px;font-weight:650}
ol.steps{margin:4px 0 12px;padding-left:20px} ol.steps li{margin:3px 0}
.btn{border:1px solid var(--line-strong);background:var(--surface-2);border-radius:6px;padding:6px 14px;cursor:pointer}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#copyArea{width:100%;min-height:140px;margin-top:10px;font:12px ui-monospace,Menlo,monospace;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px}
.log li{margin:2px 0}
.log .at{font-variant-numeric:tabular-nums;color:var(--muted);margin-right:8px}
</style>
</head>
<body>
<script id="vsm-data" type="application/json">{}</script>
<script id="vsm-summary" type="application/json">{}</script>
<main>
  <header class="section-head" id="hdr"></header>
  <section aria-labelledby="h-tot"><h2 id="h-tot" data-t="totalsTitle"></h2><div class="totals" id="totals"></div><div class="note" id="totNote"></div></section>
  <section aria-labelledby="h-map">
    <div class="maphead">
      <h2 id="h-map" style="margin:0" data-t="mapTitle"></h2>
      <div class="seg" role="group" id="viewSwitch">
        <button type="button" data-view="macro" data-t="macro"></button>
        <button type="button" data-view="detailed" data-t="detailed"></button>
      </div>
    </div>
    <p class="lanehint" id="hint"></p>
    <div class="flow-scroll" id="flowScroll"><div class="canvas" id="canvas"></div></div>
    <div class="detail" id="detail" hidden></div>
  </section>
  <section aria-labelledby="h-rw"><h2 id="h-rw" data-t="reworkTitle"></h2><div class="tw" id="rework"></div></section>
  <section aria-labelledby="h-st"><h2 id="h-st" data-t="stagesTitle"></h2><div class="tw" id="stageTable"></div><div class="note" data-t="tableNote"></div></section>
  <section aria-labelledby="h-miss"><h2 id="h-miss" data-t="missingTitle"></h2><div id="missing"></div></section>
  <section class="grid2">
    <div><h2 data-t="hypTitle"></h2><div id="hyp"></div></div>
    <div><h2 data-t="parkTitle"></h2><div id="park"></div></div>
  </section>
  <section><details class="legend" id="legendBox"><summary data-t="legendTitle"></summary><div id="legend"></div></details></section>
  <section aria-labelledby="h-log"><h2 id="h-log" data-t="logTitle"></h2><ul class="plain log" id="log"></ul></section>
  <section aria-labelledby="h-cont" id="continue">
    <h2 id="h-cont" data-t="contTitle"></h2>
    <ol class="steps" id="contSteps"></ol>
    <div class="actions">
      <button type="button" class="btn primary" id="copyBtn" data-t="copy"></button>
      <button type="button" class="btn" id="dlBtn" hidden data-t="download"></button>
      <span class="small muted" id="contStatus" role="status" aria-live="polite"></span>
    </div>
    <textarea id="copyArea" readonly hidden></textarea>
  </section>
</main>
<script>
(() => {
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const D = JSON.parse($('#vsm-data').textContent || '{}');
const S = JSON.parse($('#vsm-summary').textContent || '{}');
if (D.case && D.case.title) document.title = D.case.title;
const PX = 22; // pixels per working day, shared by the timeline and the per-stage table
const LEVELS = ['assistant', 'tooled', 'prepares', 'chains'];
const KINDS = ['accelerates', 'slows', 'bottleneck', 'new-bottleneck', 'pain', 'new-pain', 'duplicate', 'not-done'];

const UI = {
  en: {
    langLabel: 'Language', trigger: 'Trigger', end: 'End', team: 'Team',
    totalsTitle: 'Totals', lead: 'Lead time', work: 'Work', wait: 'Wait', fe: 'Flow efficiency', rca: 'Rolled %C&A',
    notMeasured: 'not measured', caOver: (n) => `over ${n} box${n === 1 ? '' : 'es'} with a %C&A`,
    feSub: 'work ÷ lead time', leadSub: 'wait + work, working days',
    incomplete: (n, m) => `${n} incomplete stage(s) (a box without work time), ${m} with no duration at all`,
    upstreamNote: (b, l) => `Upstream, outside these totals: ${b} box${b === 1 ? '' : 'es'}, ${l}.`,
    mapTitle: 'The map', macro: 'Macro', detailed: 'Detailed',
    hint: 'Read left to right. Select a box, or a line of the rework list, to draw its rework arrows; the flow scrolls sideways when it is wider than the screen.',
    who: 'Who', tools: 'Tools', workT: 'Work', waitT: 'Wait', ca: '%C&A', batch: 'Batch', actors: 'Actors',
    toConfirm: 'to confirm', upstream: 'upstream · outside totals', notDetailed: 'not detailed yet', parallel: 'parallel',
    felt: 'felt', rolledCA: 'rolled %C&A', ai: 'AI', markers: 'Markers', none: 'none', reworkOut: 'sends back', iterations: 'iterates',
    boxesNoWork: (n) => `${n} box${n === 1 ? '' : 'es'} without work time`,
    sigma: 'Σ', leadShort: 'lead', unknown: '?', source: 'source', words: 'words used',
    reworkTitle: 'Rework', rwFrom: 'From (sends back)', rwTo: 'To (redoes)', rwLabel: 'What comes back', rwCount: 'How often', rwCost: 'Cost', rwSource: 'Source', rwShow: 'Show',
    stagesTitle: 'Per stage', thStage: 'Stage', thWait: 'Wait', thWork: 'Work', thLead: 'Lead time', thShare: 'Share of lead', thEff: 'Efficiency', thRework: 'Rework ↩ / ↻', thAI: 'AI uses', thNoWork: 'Without work', thNoWait: 'Without wait', thBar: 'Wait · work',
    longest: 'longest', upstreamRow: 'Upstream (outside the lead time)', wholeStream: 'Whole stream', loopsN: (n) => `${n} loops`,
    tableNote: 'Recorded durations only: a box without duration counts as 0; the figures move as missing times come in.',
    missingTitle: 'What is still to complete', missWork: 'Boxes without a work time', missWait: 'Boxes without a wait time',
    missConfirm: 'To confirm (items and loops)', missAssumed: 'Stages still assumed', missAssumedSteps: 'Sub-steps still assumed', nothing: 'Nothing.',
    loopWord: 'loop', aiWord: 'AI use', markerWord: 'marker',
    hypTitle: 'Hypotheses', parkTitle: 'Parking (ideas for the future flow)',
    hs: { open: 'open', confirmed: 'confirmed', refuted: 'refuted', partial: 'partial' },
    ss: { confirmed: 'confirmed', assumed: 'to confirm' },
    legendTitle: 'Legend', logTitle: 'Latest changes',
    contTitle: 'Continue this map',
    cont1: 'Install the value-stream-map skill in your coding agent (Claude Code, Codex or another one that reads skills): ',
    cont2: 'Get this map’s data: copy it, or download it as JSON (or save this page as HTML and run the skill’s import).',
    cont3: 'Ask the agent to continue it: save the data as a .json file (or paste it into the conversation and ask the agent to save it), then tell it what changed or what to add.',
    copy: 'Copy the data', download: 'Download (JSON)', copied: 'Copied.', saved: 'Saved.', copyManual: 'Copy failed: the data is selected below, copy it by hand.', saveFailed: 'Download failed.',
    selBox: 'Selected box', selStage: 'Selected stage', selLoop: 'Selected loop', close: 'Close',
    loopsHere: 'Rework touching this box', noLoops: 'No rework loop touches this box.',
    lv: { assistant: 'assistant', tooled: 'tooled', prepares: 'prepares', chains: 'chains' },
    lvd: { assistant: 'on-demand assistant', tooled: 'AI built into the step', prepares: 'agent prepares, human approves', chains: 'agent chains steps, human supervises' },
    mk: { accelerates: 'accelerates', slows: 'slows', bottleneck: 'bottleneck', 'new-bottleneck': 'new bottleneck', pain: 'pain', 'new-pain': 'new pain', duplicate: 'duplicate', 'not-done': 'not done' },
    mkd: { accelerates: 'speeds the flow up', slows: 'slows the flow down', bottleneck: 'where work piles up', 'new-bottleneck': 'bottleneck created or worsened by AI', pain: 'a pain point', 'new-pain': 'a pain created by AI', duplicate: 'work done twice', 'not-done': 'step skipped on this case' },
    lg: [
      ['▽ 2.0 d', 'Queue: how long the work waits before the next box starts (wait time, warm colour). “▽ ?” = wait unknown; a plain → = no wait to show.'],
      ['Work', 'Work time of a box (cool colour), in working days (1 d = 8 h); under a day in hours. The words used are quoted.'],
      ['%C&A', 'Percent complete and accurate: share of what a box receives that it can use as is. Red under 70, amber under 90.'],
      ['Rolled %C&A', 'The product of the %C&A of the boxes that have one: the share that goes through the whole stream without coming back.'],
      ['↩ n', 'The box sends work back to an earlier box n times (rework loops). Arrows run in lanes under the boxes.'],
      ['↻ n', 'The box iterates on itself (rounds of the same work).'],
      ['Batch', 'Work moves in batches of this size (a sprint, a release train).'],
      ['Stacked boxes', 'Boxes stacked in one column run at the same time (parallel); the totals count the longest.'],
      ['Dashed', 'To confirm: a stage or sub-step still assumed, or an item inferred rather than heard.'],
      ['Dotted', 'Upstream: work before the case starts, kept out of the totals.'],
      ['~', 'Estimate (approximate figure); a range shows as min–max, “≤” for a maximum only.'],
      ['felt', 'A feeling, not a measure.'],
      ['?', 'Unknown: not recorded yet.'],
      ['Timeline', 'Under each stage, a bar of its wait then its work, all stages on one scale (22 px per working day).'],
      ['Lead time', 'Wait + work, from the trigger to the end of the case.'],
      ['Flow efficiency', 'Work ÷ lead time.'],
      ['Σ', 'A stage’s times are the sum of its boxes (a parallel group counts once, for its longest).'],
    ],
  },
  fr: {
    langLabel: 'Langue', trigger: 'Déclencheur', end: 'Fin', team: 'Équipe',
    totalsTitle: 'Totaux', lead: 'Délai total', work: 'Travail', wait: 'Attente', fe: 'Efficacité du flux', rca: '%C&A cumulé',
    notMeasured: 'non mesuré', caOver: (n) => `sur ${n} boîte${n === 1 ? '' : 's'} avec un %C&A`,
    feSub: 'travail ÷ délai total', leadSub: 'attente + travail, jours ouvrés',

function aiHtml(list) {

  return `<div class="q" title="${esc(T().waitT)} · ${esc(durTitle(w))}"><span class="tri">▽</span>${fmtDur(w)}${w.felt ? `<span class="felt">${T().felt}</span>` : ''}</div>`;
}
function boxInner(x, sid, pid, extraTags) {
  const u = T();
  const lines = [`<div class="nm">${E(x.name)}</div>`];
  const who = pid ? x.who : x.actors;
  if (who) lines.push(`<div class="ln">${E(who)}</div>`);
  if (x.tools) lines.push(`<div class="ln tools">${E(x.tools)}</div>`);
  if (x.work) lines.push(`<div class="ln wk" title="${esc(durTitle(x.work))}">${u.workT} ${fmtDur(x.work)}${x.work.text ? ` <span class="words">“${E(x.work.text)}”</span>` : ''}${x.work.felt ? ` <span class="tag felt">${u.felt}</span>` : ''}</div>`);
  else lines.push(`<div class="ln wk unknown">${u.workT} ?</div>`);
  if (typeof x.ca === 'number') lines.push(`<div class="ln" title="${x.caSource ? esc(u.source + ': ' + tr(x.caSource)) : ''}">${u.ca} <span class="ca ${caClass(x.ca)}">${x.caApprox ? '~' : ''}${x.ca} %</span>${x.caApprox ? ` <span class="tag felt">${u.felt}</span>` : ''}</div>`);
  if (x.batch) lines.push(`<div class="ln">${u.batch}: ${E(x.batch)}</div>`);

  const o = outOf(sid, pid), it = itOf(sid, pid);
  if (o) tags.push(`<span class="tag rw" title="${u.reworkOut}">↩ ${o}</span>`);
  if (it) tags.push(`<span class="tag rw" title="${u.iterations}">↻ ${it}</span>`);

function renderDetailed(cv) {
  const u = T();

    const sm = sumById(s.id) || {};
    if (i > 0) html += `<div class="link" aria-hidden="true">→</div>`;
    const steps = s.steps || [];
    let body = '';
    if (!steps.length) {
      const tags = [`<span class="tag">${u.notDetailed}</span>`];
      if (s.status !== 'confirmed') tags.push(`<span class="tag tc">${u.toConfirm}</span>`);
      body = `<div class="col" data-col><div class="unit" data-stage="${esc(s.id)}" data-step="">

      groups.forEach((g, gi) => {

function timelineHtml(detailed) {

    const bar = sm.noDurations ? '' : `<div class="bar" style="width:${Math.max(1, (sm.lead || 0) * PX)}px"><div class="bw" style="width:${(sm.wait || 0) * PX}px"></div><div class="bk" style="width:${(sm.work || 0) * PX}px"></div></div>`;

function placeTimeline(cv) {

function anchorEl(cv, sid, pid) {
  if (view === 'macro') return cv.querySelector(`[data-mbox="${CSS.escape(sid)}"]`);
  return cv.querySelector(`.unit[data-stage="${CSS.escape(sid)}"][data-step="${CSS.escape(pid || '')}"]`);
}
function drawArrows() {
  const cv = $('#canvas');
  const old = cv.querySelector('svg.arrows'); if (old) old.remove();
  cv.querySelectorAll('.box.end,.mbox.end,.box.sel,.mbox.sel').forEach((b) => b.classList.remove('end', 'sel'));
  const vis = visibleLoops();
  cv.style.setProperty('--lanes', `${vis.length ? vis.length * 26 + 18 : 14}px`);
  if (sel && sel.type === 'box') { const a = anchorEl(cv, sel.stage, view === 'macro' ? '' : sel.step); const b = a && (a.matches('button') ? a : a.querySelector('.box')); if (b) b.classList.add('sel'); }
  if (!vis.length) return;
  const base = cv.getBoundingClientRect();
  // lanes start under the lowest box of the whole map
  let bottom = 0;
  cv.querySelectorAll(view === 'macro' ? '.mbox' : '.frame').forEach((f) => { bottom = Math.max(bottom, f.getBoundingClientRect().bottom - base.top); });
  const pt = (sid, pid) => {
    const a = anchorEl(cv, sid, pid); if (!a) return null;
    const box = a.matches('button') ? a : a.querySelector('.box');
    box.classList.add('end');
    const br = box.getBoundingClientRect();
    let x = br.left - base.left + br.width / 2, y;
    if (view === 'macro') { y = br.bottom - base.top; }
    else {
      const col = a.closest('[data-col]'); const units = [...col.querySelectorAll('.unit')]; const k = units.length, idx = units.indexOf(a);
      x = br.left - base.left + br.width * (idx + 1) / (k + 1);
      y = col.getBoundingClientRect().bottom - base.top;
    }
    return { x, y };
  };
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(NS, 'svg'); svg.setAttribute('class', 'arrows');
  svg.setAttribute('width', cv.scrollWidth); svg.setAttribute('height', cv.scrollHeight);
  let parts = '';
  vis.forEach((l, i) => {
    const m = view === 'macro';
    const a = pt(l.from, m ? '' : l.fromStep), b = pt(l.to, m ? '' : l.toStep);
    if (!a || !b) return;
    const ly = bottom + 14 + i * 26;
    let x1 = a.x, x2 = b.x;
    if (Math.abs(x1 - x2) < 1) { x1 -= 14; x2 += 14; }
    const cls = `ln${l.confirm ? ' confirm' : ''}`;
    parts += `<circle cx="${x1}" cy="${a.y + 2}" r="3"></circle>`;
    parts += `<path class="${cls}" d="M${x1},${a.y + 2} L${x1},${ly} L${x2},${ly} L${x2},${b.y + 8}"></path>`;
    parts += `<path class="head" d="M${x2 - 5},${b.y + 9} L${x2},${b.y + 1} L${x2 + 5},${b.y + 9} Z"></path>`;
    const cap = `${isIter(l) ? '↻' : '↩'} ${tr(l.count || l.label || l.id)}${l.confirm ? ' · ' + T().toConfirm : ''}`;
    const tx = isIter(l) ? Math.max(x1, x2) + 6 : (x1 + x2) / 2;
    parts += `<text x="${tx}" y="${ly - 4}" text-anchor="${isIter(l) ? 'start' : 'middle'}">${esc(cap)}</text>`;
  });
  svg.innerHTML = parts;
  cv.appendChild(svg);
}
function renderDetail() {

      const srcs = (s.steps || []).flatMap((p) => [[p.work, u.workT], [p.wait, u.waitT]].filter(([d]) => d && d.source).map(([d, k]) => `${E(p.name)} · ${k}: ${E(d.source)}`).concat(p.caSource ? [`${E(p.name)} · ${u.ca}: ${E(p.caSource)}`] : []).concat((p.markers || []).filter((m) => m.source).map((m) => `${E(p.name)} · ${esc(u.mk[m.kind] || m.kind)}: ${E(m.source)}`)));
      if (srcs.length) rows.push([u.source, `<ul class="plain">${srcs.map((t) => `<li>${t}</li>`).join('')}</ul>`]);
    } else {

      rows.push([u.who, E(sel.step ? x.who : x.actors) || '?'], [u.tools, E(x.tools) || '?'], [u.workT, dur(x.work)], [u.waitT, dur(x.wait)]);
      if (typeof x.ca === 'number') rows.push([u.ca, `${x.caApprox ? '~' : ''}${x.ca} %${x.caApprox ? ' · ' + u.felt : ''}${x.caSource ? ` · ${u.source}: ${E(x.caSource)}` : ''}`]);
      if (x.batch) rows.push([u.batch, E(x.batch)]);
      if ((x.ai || []).length) rows.push([u.ai, x.ai.map((a) => `${esc(u.lv[a.level])}: ${E(a.label)}${a.who ? ' (' + E(a.who) + ')' : ''}`).join('<br>')]);
      if ((x.markers || []).length) rows.push([u.markers, x.markers.map((m) => `${esc(u.mk[m.kind] || m.kind)}: ${E(m.text)}${m.source ? ` · ${u.source}: ${E(m.source)}` : ''}`).join('<br>')]);
    }

    rows.push([u.loopsHere, ls.length ? `<ul class="plain">${ls.map(lp).join('')}</ul>` : u.noLoops]);

  el.hidden = false;
  el.innerHTML = `<div style="display:flex;justify-content:space-between;gap:8px"><b>${title}</b><button type="button" class="btn small" id="closeSel">${u.close}</button></div><dl>${rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>`;
  $('#closeSel').addEventListener('click', () => { sel = null; update(); });

// ---------- lists and tables ----------

  $('#rework').innerHTML = `<table><thead><tr><th></th><th>${u.rwFrom}</th><th>${u.rwTo}</th><th>${u.rwLabel}</th><th>${u.rwCount}</th><th class="num">${u.rwCost}</th><th>${u.rwSource}</th></tr></thead><tbody>

}

      <td class="num">${q(sm.wait, nd)}</td><td class="num">${q(sm.work, nd)}</td><td class="num">${q(sm.lead, nd)}</td>

  $('#stageTable').innerHTML = `<table><thead><tr><th class="num">#</th><th>${u.thStage}</th><th class="num">${u.thWait}</th><th class="num">${u.thWork}</th><th class="num">${u.thLead}</th><th class="num">${u.thShare}</th><th class="num">${u.thEff}</th><th class="num">${u.thRework}</th><th class="num">${u.thAI}</th><th class="num">${u.thNoWork}</th><th class="num">${u.thNoWait}</th><th>${u.thBar}</th></tr></thead><tbody>${rows}</tbody></table>`;
}

function update() { drawArrows(); renderDetail(); renderRework(); }

// ---------- continue this map ----------
const json = $('#vsm-data').textContent;
const fname = `${String((D.case && D.case.title) || 'value-stream-map').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 60).replace(/-$/, '')}.json`;
const status = (k) => { $('#contStatus').textContent = T()[k]; };
$('#copyBtn').addEventListener('click', async () => {
  try { await navigator.clipboard.writeText(json); $('#copyArea').hidden = true; status('copied'); }
  catch (e) { const a = $('#copyArea'); a.value = json; a.hidden = false; a.focus(); a.select(); status('copyManual'); }
});
// Download: through the host's download capability when the page runs as a Claude artifact that grants it
// (a plain download link does nothing there); anywhere else (local file, local server, any web host), a plain link.
(async () => {
  const b = $('#dlBtn');
  let dl = null;
  if (window.claude && typeof window.claude.use === 'function') {
    try { dl = await window.claude.use('downloads'); } catch (e) { dl = null; }
    if (!dl) return; // artifact without downloads: Copy only
  }
  b.hidden = false;
  b.addEventListener('click', async () => {
    try {
      if (dl) await dl.save({ filename: fname, data: json });
      else { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([json], { type: 'application/json' })); a.download = fname; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); }
      status('saved');
    } catch (e) { status('saveFailed'); }
  });
})();

document.querySelectorAll('#viewSwitch button').forEach((b) => b.addEventListener('click', () => {

  if (sel && sel.type === 'box' && view === 'macro') sel.step = '';

}));
let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(drawArrows, 120); });

})();
