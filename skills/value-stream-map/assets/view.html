<title><!--VSM_TITLE--></title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Layout: a value stream read left to right — AI usage above each process box, markers below, a wait/work ladder at the bottom; panels underneath. Built to be screen-shared. */
  :root {
    --bg: #F4F6F7; --surface: #FFFFFF; --ink: #15212B; --muted: #5A6873; --line: #D7DDE1;
    --accent: #1D5E86; --accent-soft: #E1ECF3;
    --good: #2B7556; --good-soft: #E1F0E8;
    --warn: #9A5F0C; --warn-soft: #F6ECDA;
    --l1: #C2410C; --l2: #92400E; --l3: #A16207; --l4: #9F1239; --l5: #7C2D12; --l6: #B45309;
    --bad: #B03A2E; --bad-soft: #F8E4E1;
    --pain: #6E4A9E; --pain-soft: #EEE7F7;
    --dup: #3F6A8A; --dup-soft: #E3EDF4;
    --flash: #FFE9A8;
    --display: "Newsreader", Georgia, serif;
    --body: "IBM Plex Sans", -apple-system, "Segoe UI", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #10171D; --surface: #18222A; --ink: #E5EBEE; --muted: #93A2AD; --line: #2A3842;
    --accent: #72B2DB; --accent-soft: #1A2E3B; --good: #6CC79D; --good-soft: #15302A;
    --warn: #E2A84F; --warn-soft: #382A15; --bad: #EE8577; --bad-soft: #3A1E1A;
    --l1: #FB923C; --l2: #D6A26B; --l3: #FACC15; --l4: #FB7185; --l5: #F0A27A; --l6: #FBBF24;
    --pain: #B79BE0; --pain-soft: #2A2238; --dup: #8DB6D4; --dup-soft: #1B2A36; --flash: #5A4A12; color-scheme: dark; } }
  :root[data-theme="dark"] {
    --bg: #10171D; --surface: #18222A; --ink: #E5EBEE; --muted: #93A2AD; --line: #2A3842;
    --accent: #72B2DB; --accent-soft: #1A2E3B; --good: #6CC79D; --good-soft: #15302A;
    --warn: #E2A84F; --warn-soft: #382A15; --bad: #EE8577; --bad-soft: #3A1E1A;
    --l1: #FB923C; --l2: #D6A26B; --l3: #FACC15; --l4: #FB7185; --l5: #F0A27A; --l6: #FBBF24;
    --pain: #B79BE0; --pain-soft: #2A2238; --dup: #8DB6D4; --dup-soft: #1B2A36; --flash: #5A4A12; color-scheme: dark; }
  :root:not([data-lang="en"]) .t-en { display: none !important; }
  :root[data-lang="en"] .t-fr { display: none !important; }

  body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 14px; line-height: 1.45; margin: 0; }
  .wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px 40px; max-width: 1800px; margin: 0 auto; }
  header { display: grid; grid-template-columns: 1fr auto; gap: 12px 24px; align-items: start; }
  .eyebrow { font: 500 11px/1.3 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .live { display: inline-flex; align-items: center; gap: 6px; color: var(--bad); }
  .live i { width: 8px; height: 8px; border-radius: 50%; background: var(--bad); display: inline-block; }
  h1 { font-family: var(--display); font-weight: 600; font-size: clamp(24px, 3vw, 34px); line-height: 1.1; margin: 6px 0 6px; text-wrap: balance; }
  .bounds { color: var(--muted); margin: 0; font-size: 14px; }
  .bounds b { color: var(--ink); font-weight: 500; }
  .team { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .team span { font-size: 12px; border: 1px solid var(--line); border-radius: 4px; padding: 3px 7px; }
  .tools { display: flex; gap: 8px; align-items: center; }
  .lang { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
  .lang button { font: 500 12px/1 var(--mono); padding: 7px 11px; border: 0; background: transparent; color: var(--muted); cursor: pointer; }
  .lang button[aria-pressed="true"] { background: var(--accent); color: var(--surface); }
  .lang button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

  .totals { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 0; border-block: 1px solid var(--line); margin: 14px 0 16px; }
  .totals div { padding: 10px 14px 10px 0; }
  .totals dt { font: 500 10.5px/1.3 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .totals dd { margin: 2px 0 0; font: 500 20px/1.2 var(--mono); font-variant-numeric: tabular-nums; }
  .totals small { display: block; font: 12px/1.3 var(--body); color: var(--muted); }

  .error { background: var(--bad-soft); color: var(--bad); border-radius: 4px; padding: 8px 12px; margin-bottom: 12px; font-size: 13px; }

  /* Scrolls sideways only: the page keeps the vertical scroll, whatever overflows by a pixel. */
  .stream-scroll { overflow-x: auto; overflow-y: hidden; padding-bottom: 6px; }
  .stream { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(190px, 1fr); grid-template-rows: auto auto 1fr auto; gap: 0; min-width: min-content; }
  .col { display: grid; grid-row: span 4; grid-template-rows: subgrid; padding: 0 10px; border-left: 1px dashed var(--line); min-width: 0; }
  .col:first-child { border-left: 0; padding-left: 0; }
  .ai { min-height: 64px; display: flex; flex-direction: column; justify-content: flex-end; gap: 4px; padding-bottom: 8px; }
  .ai-badge { font-size: 12px; line-height: 1.3; background: var(--accent-soft); color: var(--ink); border-radius: 4px; padding: 5px 7px; }
  .ai-badge .lvl { display: flex; gap: 2px; margin-bottom: 3px; }
  .ai-badge .lvl i { width: 14px; height: 4px; border-radius: 1px; background: var(--line); }
  .ai-badge .lvl i.on { background: var(--accent); }
  .ai-badge .who { color: var(--muted); font-size: 11px; }
  .box { background: var(--surface); border: 2px solid var(--ink); border-radius: 4px; padding: 10px 12px; position: relative; }
  .box.assumed { border-style: dashed; border-color: var(--muted); }
  .box .num { font: 500 11px/1 var(--mono); color: var(--muted); }
  .box h2 { font-size: 15px; font-weight: 600; margin: 3px 0 4px; line-height: 1.25; text-wrap: balance; }
  .box .actors { font-size: 12px; color: var(--ink); }
  .box .tools-used { font: 11.5px/1.3 var(--mono); color: var(--muted); margin-top: 3px; }
  .box .tag { position: absolute; top: -9px; right: 8px; font: 500 10px/1 var(--mono); background: var(--bg); color: var(--muted); padding: 2px 4px; }
  /* Parallel: the border itself turns blue (dashed when still to confirm). */
  .box.parallel { border-color: var(--accent); }
  .stream-scroll { scroll-behavior: smooth; }
  .stream { position: relative; }
  svg.loops { position: absolute; left: 0; top: 0; pointer-events: none; overflow: visible; }
  svg.loops path { fill: none; stroke-width: 2; }
  svg.loops path.hit { stroke: transparent; stroke-width: 12; pointer-events: stroke; cursor: pointer; }
  svg.loops .tbc { outline: none; }
  svg.loops .tbc path.ln { stroke-dasharray: 5 4; }
  svg.loops .head { stroke: none; }
  svg.loops g.loop { transition: opacity .2s; }
  svg.loops.picking g.loop:not(.on) { opacity: .15; }
  svg.loops g.loop.on path.ln, svg.loops g.loop.fresh path.ln { stroke-width: 3; }
  svg.loops text { pointer-events: none; }
  svg.loops .c1 path.ln, svg.loops text.c1 { stroke: var(--l1); } svg.loops .c1 text.cap { fill: var(--l1); } svg.loops .head.c1 { fill: var(--l1); }
  svg.loops .c2 path.ln, svg.loops text.c2 { stroke: var(--l2); } svg.loops .c2 text.cap { fill: var(--l2); } svg.loops .head.c2 { fill: var(--l2); }
  svg.loops .c3 path.ln, svg.loops text.c3 { stroke: var(--l3); } svg.loops .c3 text.cap { fill: var(--l3); } svg.loops .head.c3 { fill: var(--l3); }
  svg.loops .c4 path.ln, svg.loops text.c4 { stroke: var(--l4); } svg.loops .c4 text.cap { fill: var(--l4); } svg.loops .head.c4 { fill: var(--l4); }
  svg.loops .c5 path.ln, svg.loops text.c5 { stroke: var(--l5); } svg.loops .c5 text.cap { fill: var(--l5); } svg.loops .head.c5 { fill: var(--l5); }
  svg.loops .c6 path.ln, svg.loops text.c6 { stroke: var(--l6); } svg.loops .c6 text.cap { fill: var(--l6); } svg.loops .head.c6 { fill: var(--l6); }
  .dchips { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 3px; }
  .dc { font: 600 10px/1.3 var(--mono); padding: 1px 5px; border-radius: 3px; border: 1px solid var(--line); color: var(--muted); }
  .dc.ca.ok { color: var(--good); border-color: var(--good); }
  .dc.ca.mid { color: var(--warn); border-color: var(--warn); }
  .dc.ca.low { color: var(--bad); border-color: var(--bad); background: var(--bad-soft); }
  .dc.rw { color: var(--warn); border-color: var(--warn-soft); background: var(--warn-soft); }
  .dc.bt { color: var(--accent); border-color: var(--accent-soft); background: var(--accent-soft); }
  /* A queue between two boxes: the wait before the next one. */
  .subrow .q { flex: none; align-self: center; display: flex; flex-direction: column; align-items: center; gap: 1px; width: 40px; color: var(--warn); }
  .subrow .q i { font-style: normal; font-size: 16px; line-height: 1; }
  .subrow .q small { font: 600 10px/1.15 var(--mono); text-align: center; }
  .subrow .q.lead { margin-right: 2px; }
  section.rework { margin-top: 14px; }
  section.rework h3 { font: 500 11px/1.3 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
  section.rework h3 small { letter-spacing: 0; text-transform: none; font-family: var(--body); margin-left: 8px; }
  section.rework ul { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 6px; }
  section.rework li { display: flex; gap: 8px; align-items: flex-start; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; font-size: 12.5px; cursor: pointer; }
  section.rework li i { flex: none; width: 4px; align-self: stretch; border-radius: 2px; }
  section.rework li.on { border-color: var(--warn); box-shadow: 0 0 0 2px var(--warn-soft); }
  section.rework li.tbc { outline: none; border-style: dashed; }
  section.rework li em { color: var(--muted); font-size: 11.5px; }
  section.rework li.c1 i { background: var(--l1); }
  section.rework li.c2 i { background: var(--l2); }
  section.rework li.c3 i { background: var(--l3); }
  section.rework li.c4 i { background: var(--l4); }
  section.rework li.c5 i { background: var(--l5); }
  section.rework li.c6 i { background: var(--l6); }
  .loop-detail[hidden] { display: none; }
  .loop-detail { margin-top: 8px; padding: 8px 12px; border: 1.5px solid var(--warn); border-radius: 6px; background: var(--surface); font-size: 13px; display: grid; gap: 4px; }
  .box[data-ref], .subbox[data-ref] { cursor: pointer; }
  svg.loops text { paint-order: stroke; stroke: var(--surface); stroke-width: 4px; stroke-linejoin: round; }
  svg.loops text.cap { font: 600 11.5px var(--body); }
  .col.focus .box { box-shadow: 0 0 0 4px var(--accent-soft), 0 0 0 6px var(--accent); }
  .box.axis { display: flex; flex-direction: column; padding-bottom: calc(64px + var(--loop-room, 0px)); }
  .box.axis .bhead { min-height: 44px; }
  .box.axis .subrow { flex: 1; }
  .box.axis .bfoot { position: absolute; left: 12px; right: 12px; bottom: 8px; }
  /* The flow arrow between stages sits on the shared axis (top padding 10 + header 44 + rule 17, footer 64). */
  .box .flow { position: absolute; left: -17px; top: calc(50% + 3.5px - var(--loop-room, 0px) / 2 + var(--axis-shift, 0px)); transform: translateY(-50%); color: var(--muted); font-size: 14px; }
  .box:not(.axis) .flow { top: 50%; }
  .subbox.whole { color: var(--muted); }
  /* What the agent has just heard, before it is written properly: dashed, short-lived. */
  .pending { font-size: 12.5px; font-style: italic; color: var(--muted); border: 1.5px dashed var(--accent); border-radius: 4px; padding: 5px 7px; background: var(--accent-soft); }
  .sum-mk { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  .sum-mk .m { padding: 3px 6px; }
  .sum-mk .m .k { margin: 0; }
  .sum-mk .why { flex-basis: 100%; font-size: 11px; color: var(--muted); }
  .stepwrap { position: relative; display: flex; flex-direction: column; }
  .stepai { position: absolute; left: 0; right: 0; bottom: 100%; margin-bottom: 4px; display: flex; flex-direction: column; gap: 3px; }
  .stepai .ai-badge { font-size: 11.5px; padding: 4px 6px; }
  .subbox.whole b { font-weight: 500; font-style: italic; }
  .subrow { display: flex; align-items: center; gap: 4px; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); }
  .subgrp { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 6px; }
  .subrow .arrow { align-self: center; color: var(--muted); font-size: 14px; flex: none; width: 14px; text-align: center; }
  .cells { display: flex; gap: 4px; padding: 0 14px; margin-top: 4px; }
  .cells .cell { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .ai .cells .cell { justify-content: flex-end; }
  .cells .sp { flex: none; width: 14px; }
  .for { display: block; font: 600 10px/1.2 var(--mono); color: var(--muted); margin-bottom: 2px; }
  .subbox .st2 { font: 10.5px/1.3 var(--mono); color: var(--muted); }
  .subbox { border: 1.5px solid var(--ink); border-radius: 3px; padding: 6px 8px; background: var(--surface); font-size: 12.5px; line-height: 1.3; display: flex; flex-direction: column; gap: 2px; flex: none; }
  .subbox.assumed { border-style: dashed; border-color: var(--muted); }
  .subbox.upstream { border-style: dotted; border-color: var(--muted); background: var(--bg); }
  .subbox .ph { font: 500 9.5px/1.2 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  section.bystage { margin-top: 14px; }
  section.bystage h3 { font: 500 11px/1.3 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
  section.bystage h3 small { letter-spacing: 0; text-transform: none; font-family: var(--body); margin-left: 8px; }
  section.bystage .tw { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; }
  section.bystage table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
  section.bystage th, section.bystage td { padding: 6px 10px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
  section.bystage th:nth-child(-n+2), section.bystage td:nth-child(-n+2) { text-align: left; }
  section.bystage th { font: 500 10.5px/1.3 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  section.bystage tr.top td { background: var(--warn-soft); }
  section.bystage tr.up td { color: var(--muted); font-style: italic; }
  section.bystage tfoot td { font-weight: 600; border-bottom: 0; }
  section.bystage .bar { display: flex; height: 8px; width: 140px; background: var(--bg); border-radius: 2px; overflow: hidden; }
  section.bystage .bar .bq { background: var(--warn); } section.bystage .bar .bk { background: var(--accent); }
  section.bystage .unk { color: var(--muted); }
  section.bystage p.note { margin: 6px 2px 0; font-size: 11.5px; color: var(--muted); }
  .subbox b { font-weight: 600; }
  .subbox .sw { font-size: 11px; color: var(--muted); }
  .subbox .ptag { font: 600 10.5px/1.2 var(--body); color: var(--accent); }
  .subbox .minil { margin-top: auto; padding-top: 4px; display: flex; justify-content: space-between; gap: 6px; font: 500 11px var(--mono); }
  .subbox .mw { color: var(--warn); }
  .subbox .mk { color: var(--accent); }
  .lang.view { margin-right: 6px; }
  button.follow { font: 500 12px/1 var(--mono); padding: 7px 11px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); border-radius: 999px; cursor: pointer; margin-right: 6px; }
  button.follow[aria-pressed="true"] { background: var(--accent); color: var(--surface); border-color: var(--accent); }
  .box .ptag { display: block; font: 600 11px/1.25 var(--body); color: var(--accent); margin-bottom: 4px; }
  ol.sub { list-style: none; margin: 8px 0 0; padding: 6px 0 0; border-top: 1px solid var(--line); display: grid; gap: 4px; counter-reset: sub; }
  ol.sub li { font-size: 12px; line-height: 1.3; counter-increment: sub; display: grid; grid-template-columns: auto 1fr; column-gap: 5px; }
  ol.sub li::before { content: counter(sub, lower-alpha) "."; font: 500 11px var(--mono); color: var(--muted); grid-row: span 3; }
  ol.sub li.par::before { content: counter(sub, lower-alpha) "‖"; color: var(--accent); }
  ol.sub li .pmark { display: none; }
  ol.sub li.assumed b { font-weight: 500; color: var(--muted); font-style: italic; }
  ol.sub .sw { font-size: 11px; color: var(--muted); }
  ol.sub .sd { font: 500 11px var(--mono); color: var(--accent); }
  .box .sum { font: 500 10.5px var(--mono); color: var(--muted); margin-top: 4px; }
  .markers { display: flex; flex-direction: column; gap: 5px; padding-top: 8px; }
  /* Macro view: the loop lanes run between the stage boxes and their markers. */
  .stream.macro .markers { padding-top: calc(8px + var(--loop-room, 0px)); }
  .m { font-size: 12.5px; line-height: 1.35; border-radius: 4px; padding: 5px 7px; border-left: 3px solid; }
  .m .k { display: block; font: 500 10px/1.3 var(--mono); letter-spacing: .06em; text-transform: uppercase; }
  .m .src { display: block; color: var(--muted); font-size: 11px; margin-top: 2px; font-style: italic; }
  .m.accelerates { background: var(--good-soft); border-color: var(--good); } .m.accelerates .k { color: var(--good); }
  .m.slows { background: var(--warn-soft); border-color: var(--warn); } .m.slows .k { color: var(--warn); }
  .m.bottleneck { background: var(--bad-soft); border-color: var(--bad); } .m.bottleneck .k { color: var(--bad); }
  .m.new-bottleneck { background: var(--surface); border: 1px solid var(--bad); border-left: 3px solid var(--bad); } .m.new-bottleneck .k { color: var(--bad); }
  .m.pain { background: var(--pain-soft); border-color: var(--pain); } .m.pain .k { color: var(--pain); }
  .m.new-pain { background: var(--surface); border: 1px solid var(--pain); border-left: 3px solid var(--pain); } .m.new-pain .k { color: var(--pain); }
  .m.duplicate { background: var(--dup-soft); border-color: var(--dup); } .m.duplicate .k { color: var(--dup); }
  .m.not-done { background: transparent; border: 1px dashed var(--muted); border-left: 3px dashed var(--muted); } .m.not-done .k { color: var(--muted); }
  .tbc { outline: 1px dashed var(--muted); outline-offset: 2px; }
  .tbc-tag { display: inline-block; font: 500 9.5px/1 var(--mono); color: var(--muted); margin-left: 4px; text-transform: uppercase; letter-spacing: .06em; }
  .gaps li { color: var(--ink); }
  .ladder { margin-top: 12px; font: 500 12px/1.2 var(--mono); font-variant-numeric: tabular-nums; }
  .ladder .wait { border-top: 2px solid var(--warn); padding: 4px 0 10px; color: var(--warn); }
  .ladder .work { border-bottom: 2px solid var(--accent); padding: 0 0 4px; color: var(--accent); margin-left: 30%; }
  .ladder .unk { color: var(--muted); }

  .panels.top { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr) minmax(0, .8fr); }
  @media (max-width: 900px) { .panels.top { grid-template-columns: 1fr; } }
  .panel.gaps ul.cols2 { columns: 2 280px; column-gap: 24px; margin: 0; padding-left: 18px; }
  .panel.gaps ul.cols2 li { break-inside: avoid; }
  details.readall { margin-top: 16px; }
  details.readall > summary { cursor: pointer; font: 500 11px/1.3 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); padding: 8px 0; }
  details.readall .panels.ref { margin-top: 6px; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 2fr); }
  @media (max-width: 900px) { details.readall .panels.ref { grid-template-columns: 1fr; } }
  .panels { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; margin-top: 22px; }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; min-width: 0; }
  .panel h3 { font: 500 11px/1.3 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
  .panel ul { margin: 0; padding-left: 18px; font-size: 13px; }
  .panel li { margin-bottom: 4px; }
  .legend { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
  .legend .m { font-size: 11.5px; padding: 3px 6px; }

<script>
(function () {
  var root = document.documentElement;

    'new-bottleneck': ['Nouveau goulot', 'New bottleneck'],

    'new-pain': ['Nouvel irritant', 'New pain point'],
    'duplicate': ['Doublon', 'Duplicated work'],
    'not-done': ['Pas fait', 'Not done']
  };
  var LEVEL = {
    'assistant': [1, 'Assistant à la demande', 'On-demand assistant'],
    'tooled': [2, 'Étape outillée', 'Tooled step'],
    'prepares': [3, 'L’agent prépare, l’humain valide', 'Agent prepares, human approves'],
    'chains': [4, 'L’agent enchaîne, l’humain supervise', 'Agent chains steps, human supervises']

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  }

  // Display: "detail" draws each stage's sub-steps as boxes in line (parallel ones stacked), "macro" one box
  // per stage. "Follow" scrolls to the stage being discussed (now.stage) and highlights it. Per viewer.
  function pref(k, d) { try { return localStorage.getItem(k) || d; } catch (e) { return d; } }

  var prev = {};

    var m = {};

      m['s:' + s.id] = JSON.stringify([s.name, s.actors, s.tools, s.status, s.work, s.wait]);
      (s.ai || []).forEach(function (a) { m['a:' + s.id + ':' + a.label] = JSON.stringify(a); });
      (s.markers || []).forEach(function (k) { m['m:' + s.id + ':' + k.kind + ':' + k.text] = '1'; });

        m['st:' + s.id + ':' + x.name] = JSON.stringify([x.name, x.who, x.work, x.wait, x.status, x.parallel]);
        (x.ai || []).forEach(function (a) { m['a:' + s.id + '/' + x.name + ':' + a.label] = JSON.stringify(a); });
        (x.markers || []).forEach(function (k) { m['m:' + s.id + '/' + x.name + ':' + k.kind + ':' + k.text] = '1'; });
      });
    });
    (data.loops || []).forEach(function (l, j) { m['l:' + j] = JSON.stringify(l); });
    (data.parking || []).forEach(function (p) { m['p:' + (p.text || p)] = '1'; });

    function groups(list) {

    var empty = stages.filter(function (x) { var m = times(x); return !m.work && !m.wait; }).length;

    var h = [];
    if (ENDED) h.push('<div class="error" role="status">' + t('Séance terminée : cette page ne se met plus à jour.', 'Session ended: this page no longer updates.') + '</div>');
    if (errors && errors.length) h.push('<div class="error" role="alert">' + t('Dernière modification invalide, version précédente affichée : ', 'Last change is invalid, showing the previous version: ') + esc(errors[0]) + '</div>');
    h.push('<header><div><div class="eyebrow">' + esc(c.client || '') + ' · ' + t('Chaîne de valeur du SDLC', 'SDLC value stream') +
      (ENDED ? ' · ' + t('séance terminée', 'session ended') : window.VSM_LIVE ? ' <span class="live"><i></i>' + t('en direct', 'live') + '</span>' : '') + '</div>' +
      '<h1>' + esc(T(c.title)) + '</h1>' +
      '<p class="bounds">' + t('Déclencheur : ', 'Trigger: ') + '<b>' + esc(T(c.trigger) || '…') + '</b> → ' + t('Fin réelle : ', 'Real end: ') + '<b>' + esc(T(c.end) || '…') + '</b></p>' +
      '<div class="team">' + (c.team || []).map(function (p) { return '<span>' + esc(T(p)) + '</span>'; }).join('') + '</div></div>' +
      '<div class="tools"><div class="lang view" role="group" aria-label="Vue / View"><button type="button" data-view="macro" aria-pressed="' + (MODE === 'macro') + '">' + t('Macro', 'Macro') + '</button><button type="button" data-view="detail" aria-pressed="' + (MODE === 'detail') + '">' + t('Détaillée', 'Detailed') + '</button></div>' +
      (window.VSM_LIVE ? '<button type="button" class="follow" aria-pressed="' + FOLLOW + '">' + t('Suivre', 'Follow') + '</button>' : '') +

      '<div><dt>' + t('Délai total', 'Lead time') + '</dt><dd>' + (lead ? durBoth(lead) : '—') + '</dd>' + partial + (c.leadNote ? '<small>' + esc(T(c.leadNote)) + '</small>' : '') + '</div>' +
      '<div><dt>' + t('Temps de travail', 'Work time') + '</dt><dd>' + (work ? durBoth(work) : '—') + '</dd><small>&nbsp;</small></div>' +
      '<div><dt>' + t('Temps d’attente', 'Waiting time') + '</dt><dd>' + (wait ? durBoth(wait) : '—') + '</dd><small>&nbsp;</small></div>' +
      '<div><dt>' + t('Efficacité du flux', 'Flow efficiency') + '</dt><dd>' + (eff !== null ? eff + ' %' : '—') + '</dd><small>' + t('travail ÷ délai total', 'work ÷ lead time') + '</small></div>' +
      // With no box measured, say so instead of a bare dash: the rework is still visible as the loops on the map.
      '<div><dt>' + t('Complet et exact, cumulé', 'Rolled complete & accurate') + '</dt><dd>' + (rolledCA !== null ? rolledCA + ' %' : t('Non mesuré', 'Not measured')) + '</dd><small>' +
      (caN ? t('part du travail qui traverse sans reprise · ' + caN + ' case(s) mesurée(s)', 'share of work that goes through without rework · ' + caN + ' box(es) measured')

      var it = (data.loops || []).filter(function (l) { return l.from === l.to && (l.fromStep || '') === (l.toStep || '') && (l.fromStep ? l.from + '/' + l.fromStep : l.from) === ref; })[0];

        var subMk = [].concat.apply([], steps.map(function (x) { return x.markers || []; }));
        if (subAi.length) {
          var top = Math.max.apply(null, subAi.map(function (a) { return (LEVEL[a.level] || [0])[0]; }));

          ai += '<div class="ai-badge sum-ai' + (tbcA ? ' tbc' : '') + '"><div class="lvl">' + [1, 2, 3, 4].map(function (n) { return '<i class="' + (n <= top ? 'on' : '') + '"></i>'; }).join('') + '</div>' +
            t('IA dans les sous-étapes · ', 'AI in the sub-steps · ') + subAi.length + ' ' + t(subAi.length > 1 ? 'usages' : 'usage', subAi.length > 1 ? 'uses' : 'use') +
